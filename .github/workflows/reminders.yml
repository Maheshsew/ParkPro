name: Booking reminders

on:
  schedule:
    - cron: '*/5 3-13 * * *'   # every 5 min, 07:00-17:59 Mauritius time
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install firebase-admin
        working-directory: scripts
        run: npm init -y > /dev/null && npm install firebase-admin
      - name: Send due reminders
        working-directory: scripts
        run: node sendReminders.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}